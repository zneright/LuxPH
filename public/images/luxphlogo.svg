

<svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="greenGrad" x1="70" y1="20" x2="120" y2="120">
      <stop offset="0%" stop-color="#1FE6A8"/>
      <stop offset="100%" stop-color="#0BBF91"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="120" y1="110" x2="180" y2="170">
      <stop offset="0%" stop-color="#4E8DFF"/>
      <stop offset="100%" stop-color="#2F6EFF"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="70" y1="130" x2="120" y2="190">
      <stop offset="0%" stop-color="#9B6BFF"/>
      <stop offset="100%" stop-color="#7A42F4"/>
    </linearGradient>
  </defs>

  <!-- Green vertical block -->
  <rect
    x="72"
    y="20"
    width="56"
    height="104"
    rx="20"
    fill="url(#greenGrad)"
    filter="url(#glowGreen)"
  />

  <!-- Blue block -->
  <rect
    x="138"
    y="110"
    width="56"
    height="56"
    rx="18"
    fill="url(#blueGrad)"
    filter="url(#glowBlue)"
  />

  <!-- Purple block -->
  <rect
    x="72"
    y="136"
    width="56"
    height="56"
    rx="18"
    fill="url(#purpleGrad)"
    filter="url(#glowPurple)"
  />
</svg>

