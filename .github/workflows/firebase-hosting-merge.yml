name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

# 🚀 Opt into the new execution environment globally across the entire workflow runner
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Upgraded to match the modern runtime environment
          cache: 'npm'

      - name: Install Dependencies and Linux Bindings
        run: |
          npm ci
          npm install @rolldown/binding-linux-x64-gnu --no-save
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUXPH_8DC3D }}
          channelId: live
          projectId: luxph-8dc3d